<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launchpad | Robinhood Chain</title>
<meta name="description" content="Create and trade tokens on Robinhood Chain.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233D4BFF'/%3E%3Cpath d='M6 25 C 14 24, 20 19, 26 7' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.16.0/dist/ethers.umd.min.js"></script>
<style>
:root{
  --bg:#F2F3FA;--surface:#FFFFFF;--surface-2:#E9EBF7;--ink:#16183B;--muted:#5E6286;--line:#D9DCEE;
  --accent:#3D4BFF;--accent-ink:#FFFFFF;--accent-soft:#E3E6FF;--buy:#0E9F6E;--sell:#E5484D;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:22px;--r-md:14px;--r-sm:10px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0D0F2E;--surface:#161942;--surface-2:#1E2256;--ink:#EEF0FF;--muted:#9A9EC8;--line:#2A2E66;
  --accent:#7F89FF;--accent-ink:#0D0F2E;--accent-soft:#252A6B;--buy:#2BD49A;--sell:#FF6B6F}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:14px clamp(16px,4vw,40px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.mark{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
nav.main{display:flex;gap:4px;margin-left:8px}
nav.main a{text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted)}
nav.main a:hover{color:var(--ink)}
nav.main a.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.wallet-area{margin-left:auto;position:relative}

.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;text-decoration:none;border-radius:999px;padding:10px 18px;background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);transition:transform .08s ease}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.buy{background:var(--buy);color:#fff;box-shadow:none}
.btn.sell{background:var(--sell);color:#fff;box-shadow:none}
.btn.big{padding:15px 26px;font-size:17px}
.btn.wide{width:100%}
.chip{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 14px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;border:0;font-weight:700}
.chip .addr{background:var(--surface-2);padding:4px 10px;border-radius:999px;font-size:14px}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:6px;min-width:210px;box-shadow:0 18px 40px -18px rgba(10,12,40,.35)}
.menu button,.menu a{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;text-decoration:none;font-weight:600}
.menu button:hover,.menu a:hover{background:var(--surface-2)}

main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding:clamp(20px,4vw,44px) clamp(16px,4vw,40px) 60px}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;margin-bottom:48px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,5.6vw,68px);line-height:1.02;letter-spacing:-.03em;margin:0 0 18px}
.hero p{font-size:19px;color:var(--muted);max-width:34ch;margin:0 0 28px}
.hero-actions{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.stat-line{color:var(--muted);font-weight:600}
.stat-line b{font-family:var(--display);color:var(--ink);font-size:22px;margin-right:6px}
.curve-art{width:100%;height:auto;overflow:visible}
.curve-art .path{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.8s .2s cubic-bezier(.6,.1,.2,1) forwards}
.curve-art .dot{fill:var(--accent);opacity:0;animation:pop .4s 1.9s forwards}
.curve-art .grid-l{stroke:var(--line);stroke-width:1}
.curve-art .area{fill:var(--accent-soft);opacity:0;animation:fade .8s 1.2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@keyframes fade{to{opacity:.9}}
@media (prefers-reduced-motion:reduce){.curve-art .path{animation:none;stroke-dashoffset:0}.curve-art .dot,.curve-art .area{animation:none;opacity:1}}

.list-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.list-head h2{font-family:var(--display);font-size:26px;margin:0;letter-spacing:-.02em}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools input,.tools select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px;min-width:0}
.tools input{width:min(340px,70vw)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r-lg);text-decoration:none;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.card:hover .thumb img{transform:scale(1.03)}
.thumb{aspect-ratio:1/1;background:var(--surface-2);overflow:hidden}
.thumb img,.t-img img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px;color:#fff}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.card-name{font-weight:800;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.card-sym{color:var(--accent);font-weight:700;font-size:14px;overflow-wrap:anywhere}
.card-desc{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-weight:600}
.card-foot b{color:var(--ink)}
.skel{background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:var(--r-lg);min-height:330px}
@keyframes sh{to{background-position:-200% 0}}
.more{display:flex;justify-content:center;margin-top:24px}
.empty{padding:48px 24px;text-align:center;background:var(--surface);border-radius:var(--r-lg);box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}

.page-title{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,40px);letter-spacing:-.03em;margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 28px}
.create{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:40px;align-items:start}
form{display:flex;flex-direction:column;gap:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:7px}
.field>span,.legend{font-weight:700;font-size:15px}
.field input,.field textarea,.links input{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;width:100%}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field textarea:focus,.links input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.hint{color:var(--muted);font-size:13px}
.hint.err{color:var(--sell);font-weight:600}
.drop{position:relative;border:2px dashed var(--line);border-radius:var(--r-md);background:var(--surface);padding:18px;display:flex;gap:16px;align-items:center;cursor:pointer}
.drop:hover,.drop:focus-within{border-color:var(--accent)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop-thumb{width:64px;height:64px;border-radius:12px;background:var(--surface-2);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:26px}
.drop-thumb img{width:100%;height:100%;object-fit:cover}
.drop b{display:block}
.drop small{color:var(--muted)}
.links{border:0;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.links legend{margin-bottom:10px;padding:0}
.links label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--muted)}
.fee-row{display:flex;align-items:center;gap:14px}
input[type=range]{flex:1;accent-color:var(--accent);padding:0;border:0;background:none}
.fee-val{font-family:var(--display);font-weight:700;font-size:22px;min-width:64px;text-align:right}
.inline{display:flex;gap:8px;align-items:center}
.unit{font-weight:700;color:var(--muted)}
.fine{color:var(--muted);font-size:13px;margin:0}
.preview{position:sticky;top:96px}
.preview .card{pointer-events:none}
.side-note{margin-top:16px;padding:16px;border-radius:var(--r-md);background:var(--accent-soft);font-size:14px}
.side-note b{display:block;margin-bottom:4px}

.token{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
.t-head{display:flex;gap:20px;align-items:center;margin-bottom:22px}
.t-img{width:104px;height:104px;border-radius:24px;overflow:hidden;background:var(--surface-2);flex:none}
.t-img .ph{font-size:40px}
.t-head h1{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,40px);letter-spacing:-.03em;margin:0;line-height:1.1;overflow-wrap:anywhere}
.t-sym{color:var(--accent);font-weight:800;margin:2px 0 10px;overflow-wrap:anywhere}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);text-decoration:none;border:0;cursor:pointer}
.pill:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:20px;box-shadow:0 0 0 1px var(--line)}
.stats div{background:var(--surface);padding:14px 16px}
.stats small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.stats b{font-size:18px;font-weight:800}
.stats em{display:block;font-style:normal;color:var(--muted);font-size:12px;min-height:18px}
.panel{background:var(--surface);border-radius:var(--r-lg);padding:20px;box-shadow:inset 0 0 0 1px var(--line);margin-bottom:20px}
.panel h3{margin:0 0 12px;font-size:17px;font-weight:800}
.chart{width:100%;height:200px;display:block}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.chart .ar{fill:var(--accent-soft)}
.chart-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:6px}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:14px 0 0;font-size:14px}
dl.meta dt{color:var(--muted);font-weight:600}
dl.meta dd{margin:0;overflow-wrap:anywhere;font-weight:600}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline}
table.trades{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
.trades th{text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.trades td{padding:9px 8px;border-bottom:1px solid var(--line)}
.trades tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}
.b{color:var(--buy);font-weight:800}.s{color:var(--sell);font-weight:800}

.trade-box{position:sticky;top:96px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:999px;padding:4px;margin-bottom:18px}
.tabs button{border:0;background:none;padding:10px;border-radius:999px;font-weight:800;cursor:pointer;color:var(--muted)}
.tabs button.on[data-side=buy]{background:var(--buy);color:#fff}
.tabs button.on[data-side=sell]{background:var(--sell);color:#fff}
.amt{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-md);padding:6px 14px}
.amt input{flex:1;min-width:0;border:0;background:none;font-size:26px;font-weight:800;padding:8px 0;outline:none}
.amt .unit{font-size:15px}
.quick{display:flex;gap:6px;margin:10px 0 16px;flex-wrap:wrap}
.quick button{flex:1;border:0;background:var(--surface-2);padding:8px 6px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer}
.quick button:hover{background:var(--accent-soft)}
.est{display:flex;flex-direction:column;gap:6px;font-size:14px;margin-bottom:16px}
.est div{display:flex;justify-content:space-between;gap:10px}
.est span{color:var(--muted)}
.est span.s{color:var(--sell)}
.est b{text-align:right}
.slip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:16px}
.slip input{width:64px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:5px 8px;text-align:right}
.bal{font-size:13px;color:var(--muted);margin-top:12px;display:flex;justify-content:space-between;gap:8px}

.big-num{font-family:var(--display);font-weight:800;font-size:clamp(28px,5vw,44px);letter-spacing:-.02em;margin:4px 0 14px}

.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(8,10,35,.55)}
.modal[hidden]{display:none}
.modal-card{background:var(--surface);border-radius:var(--r-lg);width:min(420px,100%);padding:22px;max-height:90vh;overflow:auto}
.modal-card h2{margin:0 0 4px;font-size:20px;font-weight:800}
.modal-card p{color:var(--muted);margin:0 0 16px;font-size:14px}
.wlist{display:flex;flex-direction:column;gap:8px}
.wopt{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;text-align:left;width:100%}
.wopt:hover{border-color:var(--accent)}
.wopt img,.wopt .wph{width:32px;height:32px;border-radius:8px;flex:none;background:var(--surface-2)}
.modal-x{float:right;border:0;background:var(--surface-2);width:34px;height:34px;border-radius:999px;cursor:pointer;font-size:18px}

#toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:var(--r-md);font-weight:600;font-size:14px;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);border-left:5px solid var(--accent)}
.toast.ok{border-left-color:var(--buy)}
.toast.err{border-left-color:var(--sell)}
.toast a{color:inherit;display:inline-block;margin-top:4px}

footer{border-top:1px solid var(--line);padding:22px clamp(16px,4vw,40px);color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer a{font-weight:700}

@media (max-width:900px){
  .hero,.create,.token{grid-template-columns:1fr}
  .hero .curve-wrap{order:-1;max-width:420px}
  .preview,.trade-box{position:static}
  .token .trade-box{order:-1}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:620px){
  .top{gap:10px;flex-wrap:wrap}
  nav.main{order:3;width:100%;margin:0}
  nav.main a{flex:1;text-align:center}
  .row2,.links{grid-template-columns:1fr}
  .t-img{width:76px;height:76px;border-radius:18px}
}
</style>
</head>
<body>
<header class="top">
  <a href="#/" class="brand"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20 C 10 19, 15 15, 21 4" stroke="white" stroke-width="2.6" fill="none" stroke-linecap="round"/></svg></span><span id="brandName">Launchpad</span></a>
  <nav class="main" aria-label="Main">
    <a href="#/" data-nav="home">Tokens</a>
    <a href="#/create" data-nav="create">Create</a>
    <a href="#/earnings" data-nav="earnings">Earnings</a>
  </nav>
  <div class="wallet-area" id="walletArea"></div>
</header>

<main id="app"></main>

<footer>
  <span>Anyone can create a token here. Trading is risky, so check a project before you buy.</span>
  <span>Robinhood Chain · <a id="contractLink" target="_blank" rel="noopener noreferrer">Contract</a></span>
</footer>

<div class="modal" id="walletModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="wmTitle">
    <button class="modal-x" id="wmClose" aria-label="Close">×</button>
    <h2 id="wmTitle">Connect a wallet</h2>
    <p>Pick any wallet installed in your browser. Connecting never asks you to sign a message.</p>
    <div class="wlist" id="wlist"></div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<script>
const CONFIG = {
  siteName: "Launchpad",
  contract: "0x586447fA77054909630C8E5790216b0bD7d03Df5",
  chainId: 4663,
  chainName: "Robinhood Chain",
  explorer: "https://robinhoodchain.blockscout.com",
  walletRpc: "https://rpc.mainnet.chain.robinhood.com",
  rpcs: [
    "https://robinhood-mainnet.g.alchemy.com/v2/alch_Ndk6ILf93LlGhR2tHXjti",
    "https://robinhood-mainnet.g.alchemy.com/v2/alch_0HNVu2BHAGapBjeVumBzk",
    "https://robinhood-mainnet.g.alchemy.com/v2/alch_ox8kwqEL5Zm65Ypwv-1Ac",
    "https://robinhood-mainnet.g.alchemy.com/v2/alch_k9jJdhVKPkyPltmA3bE0R",
    "https://robinhood-mainnet.g.alchemy.com/v2/alch_RlpQydh8QIsUXriQ9cLgP",
    "https://robinhood-mainnet.g.alchemy.com/v2/alch_TXqz17s-PtL4sjnYRDZVG",
    "https://robinhood-mainnet.g.alchemy.com/v2/alch_Q6Am_eRKyv7DpDVeXUopp",
    "https://robinhood-mainnet.g.alchemy.com/v2/alch_RHX7FBExf8pVrwkbwfodI",
    "https://robinhood-mainnet.g.alchemy.com/v2/alch_z_uMMdPTlQwz16N_Iizv1",
    "https://robinhood-mainnet.g.alchemy.com/v2/alch_GEzcaPj7v0QyDMKdl0Q9u",
    "https://rpc.mainnet.chain.robinhood.com"
  ],
  pinataJwt: "",
  ipfsGateways: ["https://ipfs.io/ipfs/", "https://gateway.pinata.cloud/ipfs/", "https://dweb.link/ipfs/"],
  maxImageMB: 5,
  defaultSlippage: 5,
  pageSize: 24
};

const LP_ABI = [
  "function createToken((string name,string symbol,string image,string description,string x,string telegram,string discord,string website,string xPost) info,uint16 creatorFeeBps,uint256 minTokensOut) payable returns (address)",
  "function buy(address token,uint256 minTokensOut) payable",
  "function sell(address token,uint256 amount,uint256 minEthOut)",
  "function claimCreatorFees()",
  "function claimPlatformFees()",
  "function getInfo(address token) view returns ((string name,string symbol,string image,string description,string x,string telegram,string discord,string website,string xPost))",
  "function pools(address) view returns (address creator,uint16 creatorFeeBps,uint256 vEth,uint256 vToken,uint256 realEth,uint256 createdAt)",
  "function tokenCount() view returns (uint256)",
  "function getTokens(uint256 start,uint256 count) view returns (address[])",
  "function creatorFeesOwed(address) view returns (uint256)",
  "function platformFeesOwed() view returns (uint256)",
  "function feeWallet() view returns (address)",
  "function owner() view returns (address)",
  "function virtualEthStart() view returns (uint256)",
  "event TokenCreated(address indexed token,address indexed creator,string name,string symbol,uint16 creatorFeeBps)",

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

function tiny(n) {
  const s = n.toFixed(30);
  const m = s.match(/^0\.(0+)(\d{1,4})/);
  if (!m) return n.toExponential(2);
  const sub = "₀₁₂₃₄₅₆₇₈₉";
  return "0.0" + String(m[1].length).split("").map(c => sub[c]).join("") + (m[2].replace(/0+$/, "") || "0");
}
function num(n) {
  if (!isFinite(n)) return "–";
  const a = Math.abs(n);
  if (a === 0) return "0";
  if (a >= 1e12) return (n / 1e12).toFixed(2) + "T";
  if (a >= 1e9) return (n / 1e9).toFixed(2) + "B";
  if (a >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (a >= 1e4) return (n / 1e3).toFixed(1) + "K";
  if (a >= 1) return n.toLocaleString("en-US", { maximumFractionDigits: 4 });
  if (a >= 0.0001) return n.toLocaleString("en-US", { maximumSignificantDigits: 4 });
  return tiny(n);
}
function eth(wei) { return num(Number(ethers.formatEther(wei))); }
function usd(ethAmount) {

}
function ago(ts) {

  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + "m ago";
  if (d < 86400) return Math.floor(d / 3600) + "h ago";
  return Math.floor(d / 86400) + "d ago";
}

function safeUrl(u) {

}
function imgSources(uri) {
  uri = String(uri || "").trim();
  if (/^ipfs:\/\//i.test(uri)) {
    const cid = uri.slice(7).replace(/^ipfs\//i, "");
    if (!/^[A-Za-z0-9._\/-]+$/.test(cid)) return [];
    return CONFIG.ipfsGateways.map(g => g + cid);
  }
  if (/^https:\/\//i.test(uri)) return [uri];
  if (/^data:image\/(png|jpeg|webp|gif);base64,/i.test(uri)) return [uri];
  return [];
}
function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function placeholder(el, label) {
  const d = document.createElement("div");
  d.className = "ph";
  d.style.background = `hsl(${hue(label)} 62% 52%)`;
  d.textContent = ([...String(label || "?").trim()][0] || "?").toUpperCase();
  el.replaceChildren(d);
}
function mountImg(el, uri, label) {
  const srcs = imgSources(uri);
  if (!srcs.length) return placeholder(el, label);
  let i = 0;
  const img = new Image();
  img.alt = label || "";
  img.loading = "lazy";
  img.decoding = "async";
  img.referrerPolicy = "no-referrer";
  img.onerror = () => { i++; if (i < srcs.length) img.src = srcs[i]; else placeholder(el, label); };
  img.src = srcs[0];
  el.replaceChildren(img);
}

function feesOf(amount, bps) {
  const pf = amount * PLATFORM_BPS / BPS;
  const cf = bps > FROM_CREATOR_BPS ? amount * (bps - FROM_CREATOR_BPS) / BPS : 0n;
  return [pf, cf];
}
function ceilDiv(a, b) { return a === 0n ? 0n : (a - 1n) / b + 1n; }
function calcBuy(pool, ethIn) {
  if (ethIn <= 0n) return 0n;
  const [pf, cf] = feesOf(ethIn, BigInt(pool.fee));
  const x = ethIn - pf - cf;
  const k = pool.vEth * pool.vToken;
  return pool.vToken - ceilDiv(k, pool.vEth + x);
}
function calcSell(pool, amt) {
  if (amt <= 0n) return { out: 0n, fee: 0n };
  const k = pool.vEth * pool.vToken;
  const gross = pool.vEth - ceilDiv(k, pool.vToken + amt);
  if (gross > pool.realEth) return null;
  const [pf, cf] = feesOf(gross, BigInt(pool.fee));
  return { out: gross - pf - cf, fee: pf + cf };
}
function priceEth(pool) { return Number(pool.vEth) / Number(pool.vToken); }
function mcapEth(pool) { return Number(ethers.formatEther(pool.vEth * SUPPLY / pool.vToken)); }
function feeText(bps) {
  const creator = bps > 300 ? (bps - 300) / 100 : 0;
  return { total: 5 + creator, creator, set: bps / 100 };
}

function initChain() {
  iface = new ethers.Interface(LP_ABI);
  net = ethers.Network.from(CONFIG.chainId);
  providers = CONFIG.rpcs.map(u => new ethers.JsonRpcProvider(u, net, { staticNetwork: net }));
}
function isContractError(e) { return e && ["CALL_EXCEPTION", "INVALID_ARGUMENT", "BAD_DATA", "NUMERIC_FAULT"].includes(e.code); }
function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("RPC timeout")), ms))]); }
async function rpc(fn) {
  let last;
  for (let i = 0; i < providers.length; i++) {
    const idx = (rpcIndex + i) % providers.length;
    try {
      const r = await withTimeout(fn(providers[idx]), 10000);
      rpcIndex = idx;
      return r;
    } catch (e) {
      if (isContractError(e)) throw e;
      last = e;
      console.warn("RPC " + (idx + 1) + " failed, trying the next one", e && (e.shortMessage || e.message));
    }
  }
  throw last || new Error("All RPC endpoints failed");
}
function lp(p) { return new ethers.Contract(CONFIG.contract, LP_ABI, p); }
function erc(addr, p) { return new ethers.Contract(addr, ERC20_ABI, p); }
function normInfo(i) { return { name: i.name, symbol: i.symbol, image: i.image, description: i.description, x: i.x, telegram: i.telegram, discord: i.discord, website: i.website, xPost: i.xPost }; }
function normPool(p) { return { creator: p.creator, fee: Number(p.creatorFeeBps), vEth: p.vEth, vToken: p.vToken, realEth: p.realEth, createdAt: Number(p.createdAt) }; }
async function loadToken(addr) {
  return rpc(async p => {
    const c = lp(p);
    const [info, pool] = await Promise.all([c.getInfo(addr), c.pools(addr)]);
    return { addr, info: normInfo(info), pool: normPool(pool) };
  });
}
async function loadTokens(addrs) {
  const out = await Promise.all(addrs.map(a => loadToken(a).catch(() => null)));
  return out.filter(t => t && t.pool.creator !== ethers.ZeroAddress);
}
async function vStart() {

}

async function scanLogs(params) {
  const q = new URLSearchParams({ module: "logs", action: "getLogs", fromBlock: "0", toBlock: "latest", address: CONFIG.contract, ...params });
  const r = await fetch(`${CONFIG.explorer}/api?${q}`);
  if (!r.ok) throw new Error("Explorer unavailable");
  const j = await r.json();
  if (!Array.isArray(j.result)) return [];
  return j.result.map(l => {
    try {
      const ev = iface.parseLog({ topics: (l.topics || []).filter(Boolean), data: l.data });
      return ev ? { ev, ts: parseInt(l.timeStamp, 16), tx: l.transactionHash, block: parseInt(l.blockNumber, 16), idx: parseInt(l.logIndex, 16) || 0 } : null;
    } catch (e) { return null; }
  }).filter(Boolean).sort((a, b) => a.block - b.block || a.idx - b.idx);
}
function topicAddr(a) { return ethers.zeroPadValue(a, 32).toLowerCase(); }

function toast(msg, type = "", link = null) {
  const el = document.createElement("div");
  const set = (m, t, l) => {
    el.className = "toast " + (t || "");
    el.textContent = m;
    if (l) { const a = document.createElement("a"); a.href = l; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = "View on explorer"; el.append(document.createElement("br"), a); }
  };
  set(msg, type, link);
  $("#toasts").append(el);
  const api = { update: set, close: (ms = 0) => setTimeout(() => el.remove(), ms) };
  if (type !== "pending") api.close(6000);
  return api;
}
function errMsg(e) {
  const code = e && (e.code ?? e.info?.error?.code ?? e.error?.code);
  if (code === "ACTION_REJECTED" || code === 4001) return "Cancelled in your wallet.";
  const raw = [e?.reason, e?.shortMessage, e?.info?.error?.message, e?.message].filter(Boolean).join(" ");
  if (/slippage/i.test(raw)) return "The price moved too much. Try again or raise the max price change.";
  if (/max 20%/i.test(raw)) return "A launch buy can be at most 20% of the supply.";
  if (/insufficient funds/i.test(raw)) return "Not enough ETH for this amount plus gas.";
  if (/not enough eth/i.test(raw)) return "The pool doesn't hold enough ETH for this sale.";
  if (/name 1-32/i.test(raw)) return "The name must be 1 to 32 characters.";
  if (/symbol 1-10/i.test(raw)) return "The symbol must be 1 to 10 characters.";
  return String(e?.shortMessage || e?.reason || e?.message || "Something went wrong.").slice(0, 180);
}

async function connectWith(w) {
  try {
    const accts = await w.provider.request({ method: "eth_requestAccounts" });
    if (!accts || !accts[0]) throw new Error("No account selected.");
    closeWalletModal();
    setConnected(w, accts[0]);
    await ensureChain().catch(e => toast(errMsg(e), "err"));
  } catch (e) { toast(errMsg(e), "err"); }
}
function setConnected(w, account) {
  detach();
  state.wallet = w;
  state.account = ethers.getAddress(account);
  store("lp_wallet", w.info.rdns);
  const onAcc = a => { if (!a || !a.length) disconnect(); else { state.account = ethers.getAddress(a[0]); renderWallet(); route(); } };
  const onChain = c => { state.chainOk = parseInt(c, 16) === CONFIG.chainId; renderWallet(); };
  if (w.provider.on) { w.provider.on("accountsChanged", onAcc); w.provider.on("chainChanged", onChain); }
  state.handlers = { onAcc, onChain };
  w.provider.request({ method: "eth_chainId" }).then(onChain).catch(() => {});
  renderWallet();
  route();
}
function detach() {
  const w = state.wallet, h = state.handlers;
  if (w && h && w.provider.removeListener) { w.provider.removeListener("accountsChanged", h.onAcc); w.provider.removeListener("chainChanged", h.onChain); }
  state.handlers = null;
}
function disconnect() {
  detach();
  state.wallet = null; state.account = null; state.chainOk = false;
  store("lp_wallet", null);
  renderWallet();
  route();
}
async function ensureChain() {
  const p = state.wallet.provider;
  const hex = "0x" + CONFIG.chainId.toString(16);
  const cur = await p.request({ method: "eth_chainId" });
  if (parseInt(cur, 16) === CONFIG.chainId) { state.chainOk = true; renderWallet(); return; }
  try {
    await p.request({ method: "wallet_switchEthereumChain", params: [{ chainId: hex }] });
  } catch (e) {
    const code = e?.code ?? e?.data?.originalError?.code;
    if (code === 4902 || /unrecognized|not added|unknown chain|not been added/i.test(e?.message || "")) {
      await p.request({ method: "wallet_addEthereumChain", params: [{ chainId: hex, chainName: CONFIG.chainName, nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 }, rpcUrls: [CONFIG.walletRpc], blockExplorerUrls: [CONFIG.explorer] }] });
    } else throw e;
  }
  const c2 = await p.request({ method: "eth_chainId" });
  state.chainOk = parseInt(c2, 16) === CONFIG.chainId;
  renderWallet();
  if (!state.chainOk) throw new Error("Switch your wallet to Robinhood Chain to continue.");
}

}

async function waitReceipt(hash) {
  for (let i = 0; i < 120; i++) {
    try { const rc = await rpc(p => p.getTransactionReceipt(hash)); if (rc) return rc; } catch (e) {}
    await sleep(1500);
  }
  throw new Error("Still waiting for confirmation. Check the explorer.");
}
async function runTx(label, fn) {
  if (!state.account) { openWalletModal(); throw new Error("Connect your wallet first."); }
  await ensureChain();
  const bp = new ethers.BrowserProvider(state.wallet.provider, "any");
  const signer = await bp.getSigner(state.account);
  const t = toast(`${label}: confirm in your wallet`, "pending");
  try {
    const tx = await fn(signer);
    t.update(`${label}: waiting for the network`, "pending", explorer("tx", tx.hash));
    const rc = await waitReceipt(tx.hash);
    if (rc.status !== 1) throw new Error("The transaction failed on chain.");
    t.update(`${label}: done`, "ok", explorer("tx", tx.hash));
    t.close(7000);
    renderWallet();
    return rc;
  } catch (e) {
    t.update(errMsg(e), "err");
    t.close(9000);
    throw e;
  }
}

    const pool = { vEth: V, vToken: SUPPLY, fee: bps() };
    let w = (V / 4n) * BPS / (BPS - tot);

      btn.disabled = false; btn.textContent = "Create token";
    }
  });

async function uploadImage(file) {
  const fd = new FormData();
  fd.append("file", file);
  fd.append("pinataMetadata", JSON.stringify({ name: "token-image-" + Date.now() }));
  let r;
  try { r = await fetch("https://api.pinata.cloud/pinning/pinFileToIPFS", { method: "POST", headers: { Authorization: "Bearer " + CONFIG.pinataJwt }, body: fd }); }
  catch (e) { throw new Error("Image upload failed. Check your connection and try again."); }
  if (!r.ok) throw new Error("Image upload failed (" + r.status + "). Try again later.");
  const j = await r.json();
  if (!j.IpfsHash) throw new Error("Image upload failed. Try again.");
  return "ipfs://" + j.IpfsHash;
}

function drawChart(pts) {
  const el = $("#chart"); if (!el) return;
  if (pts.length < 2) { el.innerHTML = `<p class="fine">The chart appears after the first trade.</p>`; return; }
  const W = 600, H = 200, pad = 6;
  const ps = pts.map(x => x.p), lo = Math.min(...ps), hi = Math.max(...ps);
  const span = hi - lo || hi || 1;
  const xs = i => pad + (W - 2 * pad) * (i / (pts.length - 1));
  const ys = p => H - pad - (H - 2 * pad) * ((p - lo) / span);
  const line = pts.map((x, i) => `${i ? "L" : "M"}${xs(i).toFixed(1)} ${ys(x.p).toFixed(1)}`).join(" ");
  const area = `${line} L${xs(pts.length - 1).toFixed(1)} ${H} L${xs(0).toFixed(1)} ${H} Z`;
  const chg = (pts[pts.length - 1].p / pts[0].p - 1) * 100;
  el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Price history"><path class="ar" d="${area}"/><path class="ln" d="${line}"/></svg>
  <div class="chart-meta"><span>Low ${num(lo)} ETH</span><span class="${chg >= 0 ? "b" : "s"}">${chg >= 0 ? "+" : ""}${chg.toFixed(1)}% since launch</span><span>High ${num(hi)} ETH</span></div>`;
}

  const drawFees = async () => {
    try {
      const [mine, mk, fw, owner] = await rpc(p => { const c = lp(p); return Promise.all([c.creatorFeesOwed(acct), c.platformFeesOwed(), c.feeWallet(), c.owner()]); });
      if (!$("#myFees")) return;
      $("#myFees").textContent = eth(mine) + " ETH";
      $("#claimMine").disabled = mine === 0n;
      if ([fw, owner].map(a => a.toLowerCase()).includes(acct.toLowerCase())) {
        $("#mkPanel").hidden = false;
        $("#mkFees").textContent = eth(mk) + " ETH";
        $("#mkWallet").textContent = "Fee wallet: " + fw;
        $("#claimMk").disabled = mk === 0n;
      }
    } catch (e) { if ($("#myFees")) $("#myFees").textContent = "Couldn't load"; }
  };
  $("#claimMine").onclick = async () => { $("#claimMine").disabled = true; try { await runTx("Claim fees", s => lp(s).claimCreatorFees()); } catch (e) {} drawFees(); };
  $("#claimMk").onclick = async () => { $("#claimMk").disabled = true; try { await runTx("Send marketplace fees", s => lp(s).claimPlatformFees()); } catch (e) {} drawFees(); };
  drawFees();
  try {
    const logs = await scanLogs({ topic0: iface.getEvent("TokenCreated").topicHash, topic2: topicAddr(acct), topic0_2_opr: "and" });
    const items = await loadTokens(logs.map(l => l.ev.args.token).reverse());
    const box = $("#myTokens"); if (!box) return;
    box.innerHTML = items.length ? items.map(cardHTML).join("") : `<div class="empty" style="grid-column:1/-1"><b>No tokens yet</b><a href="#/create">Create your first token</a></div>`;
    hydrateImages(box);
  } catch (e) { const box = $("#myTokens"); if (box) box.innerHTML = `<p class="fine">Couldn't load your tokens right now.</p>`; }
}

async function loadEthUsd() {
  try {
    const r = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=usd");
    const j = await r.json();
    if (j?.ethereum?.usd) state.ethUsd = j.ethereum.usd;
  } catch (e) {}
}

function boot() {
  if (typeof ethers === "undefined") {
    app.innerHTML = `<div class="empty"><b>The page didn't load fully</b>Check your connection and reload.</div>`;
    return;
  }
  document.title = CONFIG.siteName + " | Robinhood Chain";
  $("#brandName").textContent = CONFIG.siteName;
  $("#contractLink").href = explorer("address", CONFIG.contract);
  initChain();
  $("#wmClose").onclick = closeWalletModal;
  $("#walletModal").addEventListener("click", e => { if (e.target.id === "walletModal") closeWalletModal(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeWalletModal(); });
  window.addEventListener("eip6963:announceProvider", ev => {
    const d = ev.detail; if (!d || !d.info || !d.provider) return;
    walletMap.set(d.info.uuid, d);
    if (!$("#walletModal").hidden) renderWalletList();
  });
  window.dispatchEvent(new Event("eip6963:requestProvider"));
  window.addEventListener("hashchange", route);
  renderWallet();
  route();
  loadEthUsd();
  setTimeout(async () => {
    const saved = load("lp_wallet"); if (!saved) return;
    const w = walletOptions().find(x => x.info.rdns === saved); if (!w) return;
    try { const a = await w.provider.request({ method: "eth_accounts" }); if (a && a[0]) setConnected(w, a[0]); } catch (e) {}
  }, 500);
}
boot();
</script>
